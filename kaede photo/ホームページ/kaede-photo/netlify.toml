# ────────────────────────────────────────────────────────
#  kaede photo — Netlify 設定ファイル
# ────────────────────────────────────────────────────────

[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "npm install"

[build.environment]
  NODE_VERSION = "20"

# ── 開発サーバー ─────────────────────────────────────────
[dev]
  port        = 8888
  targetPort  = 3000
  framework   = "#static"
  autoLaunch  = false

# ── Serverless Functions の設定 ──────────────────────────
[functions]
  node_bundler = "esbuild"

# ── セキュリティヘッダー ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"

# ── 画像・フォントのキャッシュ設定 ───────────────────────
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── API への CORS 制限 ────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "https://kaedephoto.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# ── 404 フォールバック ────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
