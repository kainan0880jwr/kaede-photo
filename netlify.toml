# ============================================================
# Netlify 設定ファイル
# ============================================================

[build]
  # 静的サイト本体の置き場所
  publish = "public"
  # Functions のソースディレクトリ
  functions = "netlify/functions"

[functions]
  # ESM + 依存パッケージのバンドル
  node_bundler = "esbuild"

# --- セキュリティヘッダー（全ページ共通）---------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# --- API（Functions）への明示ルーティング ---------------------
[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200

# --- URL正規化（拡張子なしURL・index.htmlへの直接アクセスを301で統一） ---
# Netlifyの既定動作では拡張子なしURLも200でそのまま配信されてしまい、
# 同一ページがGA4上で複数のパスに分裂して計測される問題があったため、
# canonicalタグと一致する正規URLへ301リダイレクトする。
# ※ /index.html → / は、Netlify側で「/」が内部的にindex.htmlを解決する
#   際に本ルールと衝突し、無限リダイレクトで500エラーを起こしたため撤去。
#   canonicalタグ（<link rel="canonical" href="https://kaede-photo.com/">）
#   で正規URLは既に明示できているため、重複コンテンツ上の実害は無い。
[[redirects]]
  from = "/newborn"
  to = "/newborn.html"
  status = 301
  force = true

[[redirects]]
  from = "/maternity"
  to = "/maternity.html"
  status = 301
  force = true

[[redirects]]
  from = "/omiyamairi"
  to = "/omiyamairi.html"
  status = 301
  force = true

[[redirects]]
  from = "/shichigosan"
  to = "/shichigosan.html"
  status = 301
  force = true

[[redirects]]
  from = "/birthday"
  to = "/birthday.html"
  status = 301
  force = true
